# Alternative to ble-diagnostics.conf, not an additional merged fragment.
# Keep the BLE-DIAG INFO events, suppress high-volume stack DEBUG messages.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_USB=n
# v0.3 otherwise gives ZMK_LOG_LEVEL an earlier unconditional default of 4.
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_INF=y
CONFIG_BT_GATT_LOG_LEVEL_INF=y
CONFIG_BT_CONN_LOG_LEVEL_INF=y
CONFIG_BT_SMP_LOG_LEVEL_INF=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=1536

# Detect faults rather than silently masking them with larger thread stacks.
CONFIG_ASSERT=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_FAULT_DUMP=2
CONFIG_THREAD_NAME=y

# Explicit opt-in for the diagnostic patch. USB remains available for CDC logs,
# but USB HID is disabled so attaching the log cable cannot steal key reports.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_USB=n
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_BT_GATT_LOG_LEVEL_DBG=y
CONFIG_BT_CONN_LOG_LEVEL_DBG=y
CONFIG_BT_SMP_LOG_LEVEL_DBG=y
CONFIG_LOG_BUFFER_SIZE=16384
# Additional stack headroom for per-report connection/subscription diagnostics.
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=1536

name: Build BLE diagnostic firmware

on:
  workflow_dispatch:
    inputs:
      disable_2m:
        description: "Disable BLE 2M PHY for the Realtek comparison test"
        type: boolean
        default: false
      fault_diagnostics:
        description: "Use quieter logs with assertions and hardware stack protection"
        type: boolean
        default: false

run-name: BLE diagnostics (disable 2M=${{ inputs.disable_2m }}, fault checks=${{ inputs.fault_diagnostics }})

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated west workspace
        shell: bash
        run: |
          set -euo pipefail
          task_dir=$(mktemp -d)
          echo "BLE_DIAG_WORKSPACE=$task_dir" >> "$GITHUB_ENV"
          mkdir -p "$task_dir/config"
          cp -R config/. "$task_dir/config/"
          cd "$task_dir"
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      - name: Check source version and apply diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          cd "$BLE_DIAG_WORKSPACE"
          test "$(git -C zmk rev-parse HEAD)" = edf5c0814fd3ea202e43aad2d68fd32e882a518c
          # west update skips inactive groups; freeze the same active project set.
          west manifest --freeze --active-only > resolved-manifest.yml
          git -C zmk apply --check "$GITHUB_WORKSPACE/diagnostics/zmk-v0.3-ble-diagnostics.patch"
          git -C zmk apply "$GITHUB_WORKSPACE/diagnostics/zmk-v0.3-ble-diagnostics.patch"
          git -C zmk diff > applied-diagnostics.patch

      - name: Build OMM with BLE diagnostics and USB serial logging
        shell: bash
        env:
          DISABLE_2M: ${{ inputs.disable_2m }}
          FAULT_DIAGNOSTICS: ${{ inputs.fault_diagnostics }}
        run: |
          set -euo pipefail
          cd "$BLE_DIAG_WORKSPACE"
          phy_args=()
          if [ "$DISABLE_2M" = true ]; then
            phy_args=(-DCONFIG_BT_CTLR_PHY_2M=n)
          fi
          diag_conf="$GITHUB_WORKSPACE/diagnostics/ble-diagnostics.conf"
          if [ "$FAULT_DIAGNOSTICS" = true ]; then
            diag_conf="$GITHUB_WORKSPACE/diagnostics/ble-fault-diagnostics.conf"
          fi
          west build -s zmk/app -d build -b OMM_nrf52840 -- \
            -DSHIELD=OMM \
            -DZMK_CONFIG="$BLE_DIAG_WORKSPACE/config" \
            -DZMK_EXTRA_MODULES="$GITHUB_WORKSPACE" \
            -DEXTRA_CONF_FILE="$diag_conf" \
            "${phy_args[@]}"
          if [ "$DISABLE_2M" = true ]; then
            grep -Fx '# CONFIG_BT_CTLR_PHY_2M is not set' build/zephyr/.config
          fi
          if [ "$FAULT_DIAGNOSTICS" = true ]; then
            for setting in CONFIG_ASSERT=y CONFIG_HW_STACK_PROTECTION=y CONFIG_FAULT_DUMP=2 \
              CONFIG_THREAD_NAME=y CONFIG_ZMK_LOG_LEVEL=3 CONFIG_BT_CONN_LOG_LEVEL=3 \
              CONFIG_BT_GATT_LOG_LEVEL=3 CONFIG_BT_SMP_LOG_LEVEL=3; do
              if ! grep -Fx "$setting" build/zephyr/.config; then
                symbol="${setting%%=*}"
                echo "::error::Expected $setting; actual configuration follows"
                grep -E "^${symbol}=|^# ${symbol} is not set$" build/zephyr/.config || true
                exit 1
              fi
            done
          fi

      - name: Collect firmware and build evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ble-diagnostic-artifacts"
          cd "$BLE_DIAG_WORKSPACE"
          for file in resolved-manifest.yml applied-diagnostics.patch \
            build/zephyr/.config build/zephyr/zephyr.dts build/zephyr/zmk.uf2 \
            build/zephyr/zmk.elf build/zephyr/zmk.map; do
            if [ -f "$file" ]; then
              cp "$file" "$GITHUB_WORKSPACE/ble-diagnostic-artifacts/"
            fi
          done
          if [ -f build/zephyr/.config ]; then
            cp build/zephyr/.config "$GITHUB_WORKSPACE/ble-diagnostic-artifacts/zephyr.config"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OMM-BLE-diagnostics${{ inputs.disable_2m && '-1M' || '' }}${{ inputs.fault_diagnostics && '-fault' || '' }}
          path: ble-diagnostic-artifacts/
          if-no-files-found: warn
